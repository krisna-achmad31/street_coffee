  gap: ^3.0.1
  geocoding: ^4.0.0
  geolocator: ^14.0.2
  get_it: ^9.2.1
  go_router: ^17.3.0
  google_fonts: ^8.1.0
  google_sign_in: ^7.2.0
  image_picker: ^1.2.2
  in_app_purchase: ^3.3.1
  intl: ^0.20.3
  latlong2: ^0.9.1
