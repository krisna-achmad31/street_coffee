version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  cached_network_image: ^3.4.1
  cloud_firestore: ^6.5.0
  cloud_functions: ^6.5.0
  crypto: ^3.0.7
  dartz: ^0.10.1
  equatable: ^2.0.8
  firebase_auth: ^6.5.2
  firebase_core: ^4.10.0
  firebase_database: ^12.4.2
  firebase_storage: ^13.4.2
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_map: ^8.3.0
