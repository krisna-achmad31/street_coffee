  permission_handler: ^12.0.3
  qr_flutter: ^4.1.0
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  shimmer: ^3.0.0
  url_launcher: ^6.3.2
  uuid: ^4.5.3


dev_dependencies:
